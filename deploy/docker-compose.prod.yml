services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    # 외부에 포트를 노출하지 않는다. 같은 네트워크의 api 만 접근한다.

  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      TZ: Asia/Seoul
      API_PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      JWT_SECRET: ${JWT_SECRET}
      ADMIN_COOKIE_NAME: scj_admin_token
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      AI_MODEL: ${AI_MODEL}
      TRANSLATION_MODEL: ${TRANSLATION_MODEL}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3:8b}
      OLLAMA_TIMEOUT_MS: ${OLLAMA_TIMEOUT_MS:-120000}
      WEBSITE_ORIGIN: https://${DOMAIN}
      ADMIN_ORIGIN: https://${DOMAIN}
      # 서버 시작에는 필요 없지만, "docker compose exec api ..." 로 시드
      # 스크립트를 돌릴 때 이 컨테이너 환경에 값이 있어야 .env 에 적은
      # 계정으로 생성된다 - 없으면 seed.ts 의 하드코딩된 기본값으로 조용히
      # 만들어진다.
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy

  admin:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.admin
      args:
        # 같은 도메인이므로 상대 경로를 쓴다. CORS 문제가 사라진다.
        NEXT_PUBLIC_API_URL: https://${DOMAIN}
        NEXT_BASE_PATH: /admin
    restart: unless-stopped
    depends_on:
      - api

  website:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./nginx/site.conf:/etc/nginx/templates/site.conf.template:ro
      - certbot_conf:/etc/letsencrypt:ro
      - certbot_www:/var/www/certbot:ro
    depends_on:
      - api
      - admin
      - website

  certbot:
    image: certbot/certbot
    volumes:
      - certbot_conf:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    profiles: [tools]
    entrypoint: [certbot]
    command: [renew]

  backup:
    image: postgres:16
    restart: unless-stopped
    environment:
      TZ: Asia/Seoul
      PGPASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - ./backup:/backup
      - backup_data:/backups
    entrypoint: ["/bin/bash", "/backup/backup.sh"]
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  certbot_conf:
  certbot_www:
  backup_data:
