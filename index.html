<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>StemCareJapan | 서비스 선택</title>
  <meta name="description" content="StemCareJapan의 일본 줄기세포 치료 안내와 일본 고객 대상 한국 방문 컨시어지 서비스를 선택하세요." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Noto+Serif+KR:wght@500;600;700&family=Noto+Sans+JP:wght@400;500;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.5.0/css/all.min.css" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="service-home">
  <main class="service-gateway">
    <div class="gateway-bg gateway-bg-stemcell"></div>
    <div class="gateway-bg gateway-bg-travel"></div>
    <div class="gateway-overlay"></div>

    <div class="container gateway-inner">
      <a href="/" class="logo gateway-logo" aria-label="StemCareJapan home">
        <span class="logo-icon"><i class="fas fa-leaf"></i></span>
        <span class="logo-text">StemCare<span class="logo-japan">Japan</span></span>
      </a>

      <section class="gateway-heading" aria-labelledby="gateway-title">
        <span class="section-tag">Choose Your Service</span>
        <h1 id="gateway-title">StemCareJapan</h1>
        <p>목적에 맞는 서비스를 선택해주세요.</p>
      </section>

      <section class="service-choice-grid" aria-label="서비스 선택">
        <a href="stemcell/" class="service-choice-card service-choice-stemcell">
          <span class="choice-kicker">For Korean Clients</span>
          <i class="fas fa-dna choice-icon"></i>
          <h2>일본 줄기세포 치료 안내</h2>
          <p>한국에서 일본으로 치료를 준비하는 고객을 위한 병원, 치료, 통역, 숙박, 이동 토탈케어 서비스입니다.</p>
          <span class="choice-link">한국어로 보기 <i class="fas fa-arrow-right"></i></span>
        </a>

        <a href="korea-travel/" class="service-choice-card service-choice-travel" lang="ja">
          <span class="choice-kicker">For Japanese Clients</span>
          <i class="fas fa-suitcase-rolling choice-icon"></i>
          <h2>韓国旅行コンシェルジュ</h2>
          <p>日本から韓国へ訪問されるお客様へ、空港送迎、宿泊、通訳、美容、観光、ショッピングを一括で手配します。</p>
          <span class="choice-link">日本語で見る <i class="fas fa-arrow-right"></i></span>
        </a>
      </section>
    </div>
  </main>
  <script src="js/chat-widget.js"></script>
</body>
</html>
